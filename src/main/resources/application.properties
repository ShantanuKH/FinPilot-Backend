spring.application.name=FinPilot

#spring.profiles.active=local

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Server
server.port=${PORT:8080}

# Logging
logging.level.root=INFO
logging.level.com.shantanu.FinPilot=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n



# Groq
spring.ai.openai.base-url=${GROQ_BASE_URL}
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.options.model=${GROQ_MODEL}



# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update